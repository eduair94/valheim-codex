name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The `secrets` context is not allowed in a step's `if:` — GitHub rejects
      # the whole file ("workflow file issue") and CI never starts, which is
      # what happened on every run since this step was added. The job states
      # only whether the secret exists; the step that needs its value maps it
      # itself, so no other step (installs included) ever sees it.
      HAS_EVAL_DATABASE: ${{ secrets.EVAL_DATABASE_URL != '' }}

    # Actions pinned to full commit SHAs, as in ingest.yml and for the same
    # reason: the eval step below holds a database credential.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` here: pnpm/action-setup reads `packageManager` from
      # package.json, and naming a version as well fails the job with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on critical advisories in what the production image ships.
      # Critical rather than high: the remaining high advisories are all in
      # @huggingface/transformers' own dependencies — its sharp (the app only
      # embeds text, so no image ever reaches it) and onnxruntime-node's
      # adm-zip (used when the runtime is installed) — plus the pinned
      # puter.js SDK's postal-mime, and none of their parents accepts a fixed
      # version yet. Gating on high would fail every build on findings nobody
      # can act on; raise it once they can be.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      - run: pnpm typecheck
      - run: pnpm lint

      # The suite boots PGlite in memory, so it needs no database service and
      # no API key: embeddings are stubbed with a deterministic fake.
      - run: pnpm test

      - name: Build
        env:
          PGLITE_DATA_DIR: .data/ci
        run: pnpm build

      # Retrieval quality, measured without the LLM rewrite: no API key, no
      # quota, and it exercises the deterministic path the app falls back to.
      # Skipped when there is no index to measure against.
      - name: Cache the embedding model
        if: env.HAS_EVAL_DATABASE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache
          key: embedding-model-${{ runner.os }}-${{ hashFiles('src/lib/rag/embed-local.ts', 'pnpm-lock.yaml') }}

      - name: Retrieval quality
        if: env.HAS_EVAL_DATABASE == 'true'
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          EMBEDDING_PROVIDER: local
          MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
        run: pnpm eval --no-rewrite
